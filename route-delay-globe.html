    <style>

        display: flex;

      .routelist {
        overflow-y: auto;

        margin: 0 -6px;

        border-top: 1px solid var(--line);
        padding-top: 8px;
      }
      .routelist button {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        gap: 8px;
        padding: 7px 8px;
        border: 0;
        background: transparent;
        border-radius: 10px;
        cursor: pointer;
        font: inherit;
        text-align: left;
        color: var(--text);
      }
      .routelist button:hover, .routelist button.active { background: var(--panel); }
      .routelist .rank { color: var(--muted); font-size: 0.78rem; width: 18px; flex: none; }
      .routelist .city { flex: 1; font-size: 0.88rem; }
      .routelist .pct { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 0.85rem; flex: none; }
      .hint {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        font-size: 0.76rem;
        color: var(--muted);
        opacity: 0.8;
      }
      .detail {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 3;
        width: 300px;
        padding: 20px 22px;
        background: var(--panel-strong);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }
      .detail h3 { margin: 4px 0 2px; font-family: "Space Grotesk", sans-serif; font-size: 1.4rem; letter-spacing: -0.02em; }
      .detail .dmodel { margin: 0 0 12px; font-size: 0.85rem; color: var(--muted); }
      .rbadge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #fff;
        margin-bottom: 8px;
      }
      .dreason { font-size: 0.85rem; line-height: 1.55; color: var(--muted); margin: 0 0 10px; }
      .detail .droute {
        padding: 12px 0;
        border-top: 1px solid rgba(43, 39, 50, 0.1);
        font-size: 0.9rem;
        line-height: 1.6;
        color: var(--muted);
      }
      .detail .droute b { color: var(--text); font-family: "Space Grotesk", sans-serif; }
      .detail .dstats { padding-top: 10px; border-top: 1px solid rgba(43, 39, 50, 0.1); font-size: 0.85rem; color: var(--muted); line-height: 1.7; }
      .detail .dstats b { color: var(--text); }
      #dclose { position: absolute; top: 12px; right: 14px; background: none; border: 0; color: var(--muted); font-size: 1.3rem; cursor: pointer; line-height: 1; }
      #dclose:hover { color: var(--text); }
      @media (max-width: 900px) {
        .globe-panel { left: 12px; right: auto; bottom: 12px; top: 90px; width: 220px; padding: 16px; }
        .big-count { font-size: 2.2rem; }
        .detail { right: 12px; bottom: 12px; width: min(300px, calc(100vw - 260px)); padding: 16px; }
      }

    <script>
      window.I18N_LANG = "en";
      window.I18N = {
        "brand.name": "Route delay globe",
        "brand.sub": "from the IST dataset · 2026-05-01–07-28",
        "nav.back": "← Phase 2",
        "panel.eyebrow": "Highest delay risk · departing IST",
        "panel.sub": "routes (≥20 passenger flights, cargo excluded)",
        "ramp.low": "lower risk",
        "ramp.high": "higher risk",
        "panel.hint": "Click a route in the list, or click a line on the globe, for details.",
      };
    </script>

    <script>
      // ------------------------------------------------------------------
      // DATA — a static snapshot (not live-fetched). Same "flew & null-
      // delay=on-time" honesty rule as the rest of the site: pct_delayed is
      // the share of flights on that route that were actually 15+ min late
      // (the number that matters for "how risky is this route"), median can
      // sit at 0 even on a risky route if MOST flights are fine and a large
      // minority are seriously late — that's why routes are ranked by
      // pct_delayed, not median (median floors to 0 too easily to rank by).
      // ------------------------------------------------------------------
      // cat: 'sanctions' | 'documented' (real, sourced 2026 incidents) |
      // 'capacity' (structural airport/infrastructure limits) | 'cargo'
      // (data-quality note) | 'sample' (too small to trust the %% alone).
      // reason: [English, Turkish] — researched per-route, sources in the
      // conversation this page was built from; not exhaustive causation,
      // just the best documented explanation found for each route.
      const ROUTES = [
       {"icao":"UMMS","name":"Minsk National Airport","city":"Minsk","lat":53.888,"lon":28.04,"flights":85,"median":25.0,"pct_delayed":57.6,
        "cat":"sanctions","reason":["Belarus is under Western sanctions, complicating routing, ground handling, and diplomatic coordination for carriers still serving it.","Belarus Batı yaptırımları altında; bu da hâlâ oraya uçan havayolları için rota, yer hizmetleri ve diplomatik koordinasyonu zorlaştırıyor."]},
       {"icao":"OPKC","name":"Jinnah International Airport","city":"Karachi","lat":24.907,"lon":67.161,"flights":107,"median":16.0,"pct_delayed":54.2,
        "cat":"documented","reason":["2026 incidents: 10+ flights bunched into one departure slot, dense fog dropping visibility to 50m, and immigration processing bottlenecks.","2026 olayları: tek bir kalkış dilimine 10'dan fazla uçuşun yığılması, görüşü 50 metreye düşüren yoğun sis ve pasaport kontrolünde tıkanıklık."]},
       {"icao":"UUDD","name":"Domodedovo International Airport","city":"Moscow","lat":55.409,"lon":37.906,"flights":165,"median":13.0,"pct_delayed":48.5,
        "cat":"sanctions","reason":["THY is one of the few carriers still flying to/over Russia post-2022. July 2026: THY flights out of Moscow were delayed up to 10 hours.","THY, 2022 sonrası hâlâ Rusya'ya/üzerinden uçan az sayıda havayolundan biri. Temmuz 2026'da THY'nin Moskova çıkışlı uçuşları 10 saate kadar rötar yaptı."]},
       {"icao":"URML","name":"Uytash Airport","city":"Makhachkala","lat":42.817,"lon":47.652,"flights":60,"median":0.0,"pct_delayed":45.0,
        "cat":"sanctions","reason":["North Caucasus, Russia — the same sanctions-era overflight and coordination friction as Moscow.","Kuzey Kafkasya, Rusya — Moskova ile aynı yaptırım dönemi üstten geçiş ve koordinasyon sürtünmesi."]},
       {"icao":"OOMS","name":"Muscat International Airport","city":"Muscat/Seeb","lat":23.6,"lon":58.285,"flights":132,"median":11.0,"pct_delayed":43.9,
        "cat":"documented","reason":["2026 saw repeated multi-airline disruption waves (70+ delays in single events) and regional capacity cuts destabilizing the schedule.","2026'da tekrarlayan çok havayollu aksama dalgaları (tek olayda 70+ rötar) ve bölgesel kapasite kesintileri programı istikrarsızlaştırdı."]},
       {"icao":"UWWW","name":"Kurumoch International Airport","city":"Samara","lat":53.505,"lon":50.164,"flights":23,"median":6.0,"pct_delayed":43.5,
        "cat":"sanctions","reason":["Russia sanctions friction — and only 23 flights in this sample, so treat the percentage cautiously.","Rusya yaptırım sürtünmesi — ayrıca bu örneklemde yalnızca 23 uçuş var, yüzdeyi temkinli okuyun."]},
       {"icao":"CYYZ","name":"Toronto Pearson International Airport","city":"Toronto","lat":43.676,"lon":-79.629,"flights":111,"median":8.0,"pct_delayed":43.2,
        "cat":"documented","reason":["2026 incident reports name Turkish Airlines directly: tight aircraft rotations at Pearson mean one late inbound ripples through the day's whole schedule.","2026 olay raporları THY'yi doğrudan sayıyor: Pearson'da sıkı uçak rotasyonları, bir gecikmiş inişin günün tüm programına yayılması anlamına geliyor."]},
       {"icao":"LGIR","name":"Heraklion International Nikos Kazantzakis Airport","city":"Heraklion","lat":35.34,"lon":25.18,"flights":63,"median":12.0,"pct_delayed":42.9,
        "cat":"capacity","reason":["50+ year old infrastructure rated for ~10 arrivals/hour; summer demand runs well past that, with no real backup runway for large aircraft.","50 yılı aşkın altyapı saatte ~10 iniş için tasarlanmış; yaz talebi bunun çok üzerinde, büyük uçaklar için gerçek bir yedek pist de yok."]},
       {"icao":"VTSP","name":"Phuket International Airport","city":"Phuket","lat":8.113,"lon":98.317,"flights":35,"median":8.0,"pct_delayed":42.9,
        "cat":"documented","reason":["2026: a hard landing shut Phuket's only runway, plus immigration system faults and Dubai/Doha transit-hub chaos feeding through.","2026: sert bir iniş Phuket'in tek pistini kapattı; buna pasaport sistemi arızaları ve Dubai/Doha aktarma merkezlerindeki kaos eklendi."]},
       {"icao":"URMG","name":"Akhmat Kadyrov Grozny International Airport","city":"Grozny","lat":43.388,"lon":45.7,"flights":34,"median":9.0,"pct_delayed":41.2,
        "cat":"sanctions","reason":["North Caucasus, Russia — same overflight and coordination friction as Moscow.","Kuzey Kafkasya, Rusya — Moskova ile aynı üstten geçiş ve koordinasyon sürtünmesi."]},
       {"icao":"URMO","name":"Beslan Airport","city":"Beslan","lat":43.206,"lon":44.606,"flights":43,"median":0.0,"pct_delayed":37.2,
        "cat":"sanctions","reason":["North Caucasus, Russia — same overflight and coordination friction as Moscow.","Kuzey Kafkasya, Rusya — Moskova ile aynı üstten geçiş ve koordinasyon sürtünmesi."]},
       {"icao":"SVMI","name":"Simon Bolivar International Airport","city":"Maiquetía","lat":10.601,"lon":-66.991,"flights":35,"median":0.0,"pct_delayed":37.1,
        "cat":"sanctions","reason":["Venezuela remains under heavy US sanctions, complicating fuel, parts, and financial clearing for international carriers.","Venezuela hâlâ ağır ABD yaptırımları altında; bu da uluslararası havayolları için yakıt, yedek parça ve finansal takası zorlaştırıyor."]},
       {"icao":"LGSR","name":"Santorini International Airport","city":"Santorini Island","lat":36.4,"lon":25.479,"flights":28,"median":10.5,"pct_delayed":35.7,
        "cat":"capacity","reason":["A short caldera-edge runway with no room to expand; one delay can cascade 24-48h since the schedule has no slack.","Genişleme imkânı olmayan, kaldera kenarında kısa bir pist; programda boşluk olmadığından tek bir gecikme 24-48 saat sürebiliyor."]},
       {"icao":"LDSP","name":"Split Airport","city":"Split","lat":43.539,"lon":16.298,"flights":45,"median":0.0,"pct_delayed":35.6,
        "cat":"capacity","reason":["Adriatic summer tourist surge overwhelms the airport; ground-staffing shortages compound it June-August.","Adriyatik yaz turist patlaması havalimanını aşıyor; Haziran-Ağustos'ta yer personeli eksikliği bunu ağırlaştırıyor."]},
       {"icao":"OMSJ","name":"Sharjah International Airport","city":"Sharjah","lat":25.329,"lon":55.517,"flights":107,"median":2.0,"pct_delayed":34.6,
        "cat":"documented","reason":["A low-cost, point-to-point hub for the Gulf-South Asia corridor; 2026 saw repeated multi-carrier disruption waves there.","Körfez-Güney Asya koridoru için düşük maliyetli, noktadan noktaya bir merkez; 2026'da orada tekrarlayan çok havayollu aksama dalgaları yaşandı."]},
       {"icao":"HHAS","name":"Asmara International Airport","city":"Asmara","lat":15.292,"lon":38.911,"flights":67,"median":5.0,"pct_delayed":34.3,
        "cat":"capacity","reason":["Eritrea is diplomatically isolated with almost no resident carriers; foreign airlines serving it face friction other routes don't — Ethiopian Airlines was suspended entirely amid a dispute with authorities.","Eritre diplomatik olarak izole, neredeyse hiç yerleşik havayolu yok; oraya uçan yabancı havayolları başka rotalarda görülmeyen sürtünmeyle karşılaşıyor — Ethiopian Airlines, yetkililerle anlaşmazlık yüzünden tamamen askıya alınmıştı."]},
       {"icao":"OIMM","name":"Shahid Hasheminejad Airport","city":"Mashhad","lat":36.235,"lon":59.641,"flights":59,"median":0.0,"pct_delayed":33.9,
        "cat":"sanctions","reason":["Iran sanctions complicate fuel, parts, and financial clearing for international carriers.","İran yaptırımları uluslararası havayolları için yakıt, yedek parça ve finansal takası zorlaştırıyor."]},
       {"icao":"EBLG","name":"Liège Airport","city":"Grâce-Hollogne","lat":50.639,"lon":5.444,"flights":74,"median":5.5,"pct_delayed":33.8,
        "cat":"caveat","reason":["Data note: Liège lost all scheduled passenger service in Jan 2026 — it's cargo-only. Even after removing flights our detector catches as Turkish Cargo, these 74 remaining ones are still suspect; the detector likely misses cargo flights on a different flight-number block.","Veri notu: Liège Ocak 2026'da tüm yolcu seferlerini kaybetti — artık sadece kargo. Dedektörümüzün Turkish Cargo olarak yakaladığı uçuşlar çıkarıldıktan sonra bile, kalan bu 74 uçuş hâlâ şüpheli; dedektör muhtemelen farklı bir uçuş numarası bloğu kullanan kargo uçuşlarını kaçırıyor."]},
       {"icao":"UWKD","name":"Kazan International Airport","city":"Kazan","lat":55.606,"lon":49.279,"flights":163,"median":0.0,"pct_delayed":32.5,
        "cat":"sanctions","reason":["Tatarstan, Russia — same sanctions-era overflight and coordination friction as Moscow. Confirmed as a real, year-round Turkish Airlines route (TK429), not a data artifact.","Tataristan, Rusya — Moskova ile aynı yaptırım dönemi üstten geçiş ve koordinasyon sürtünmesi. Yıl boyu gerçek bir THY rotası olduğu doğrulandı (TK429), veri hatası değil."]},
       {"icao":"DAAG","name":"Houari Boumediene Airport","city":"Algiers","lat":36.694,"lon":3.215,"flights":610,"median":0.0,"pct_delayed":32.5,
        "cat":"unexplained","reason":["No documented incident found for this route specifically — but with 610 flights, the largest sample of any route here, this is a real, statistically solid pattern, not noise. The cause isn't identifiable from public reporting alone.","Bu rota için özel olarak belgelenmiş bir olay bulunamadı — ama 610 uçuşla (buradaki en büyük örneklem) bu gerçek, istatistiksel olarak sağlam bir örüntü, gürültü değil. Neden, kamuya açık kaynaklardan tek başına belirlenemiyor."]},
      ];
      const CATS = {
        sanctions: { color: "#c0122a", label: ["Sanctions / geopolitical", "Yaptırım / jeopolitik"] },
        documented: { color: "#1f9e93", label: ["Documented 2026 disruption", "Belgelenmiş 2026 aksaması"] },
        capacity: { color: "#2b50b5", label: ["Airport capacity / structural", "Havalimanı kapasitesi / yapısal"] },
        caveat: { color: "#8a6d1a", label: ["Data caveat — see note", "Veri notu — açıklamaya bak"] },
        unexplained: { color: "#6b4a9e", label: ["No documented cause found", "Belgelenmiş neden bulunamadı"] },
      };
      const IST = { lat: 41.275, lon: 28.732 };
      const MIN_PCT = Math.min(...ROUTES.map(r => r.pct_delayed));
      const MAX_PCT = Math.max(...ROUTES.map(r => r.pct_delayed));

      // sequential ramp, ONE hue (THY red), light -> dark by delay risk —
      // magnitude gets a sequential ramp, never a categorical rainbow
      function riskColor(pct) {
        const t = (pct - MIN_PCT) / (MAX_PCT - MIN_PCT || 1);
        const light = [0xf3, 0xc6, 0xcc], dark = [0x7a, 0x0f, 0x1f];
        const mix = (a, b) => Math.round(a + (b - a) * t);
        return `rgb(${mix(light[0],dark[0])},${mix(light[1],dark[1])},${mix(light[2],dark[2])})`;
      }

      const $ = id => document.getElementById(id);
      const tip = $("tip");
      let selected = null;

      // --- globe (same visual language as the live THY globe) ---
      const globe = Globe()($("globe"))
        .globeImageUrl(null)
        .backgroundColor("rgba(0,0,0,0)")
        .showAtmosphere(true)
        .atmosphereColor("#1f9e93")
        .atmosphereAltitude(0.16)
        .polygonCapColor(f => (f.properties.ADM0_A3 === "TUR" ? "rgba(232,25,50,0.40)" : "rgba(250,247,242,0.95)"))
        .polygonSideColor(() => "rgba(0,0,0,0)")
        .polygonStrokeColor(() => "rgba(36,67,155,0.45)")
        .polygonAltitude(0.006)
        .polygonsTransitionDuration(0)
        .arcsData(ROUTES)
        .arcStartLat(() => IST.lat).arcStartLng(() => IST.lon)
        .arcEndLat(d => d.lat).arcEndLng(d => d.lon)
        .arcColor(d => [riskColor(d.pct_delayed), riskColor(d.pct_delayed)])
        .arcStroke(d => (d === selected ? 1.1 : 0.5))
        .arcAltitudeAutoScale(0.35)
        .arcDashLength(0.5)
        .arcDashGap(0.15)
        .arcDashAnimateTime(2200)
        .onArcClick(select)
        .onArcHover(d => { if (d) showTip(d); else hideTip(); })
        .labelsData(ROUTES)
        .labelLat(d => d.lat).labelLng(d => d.lon)
        .labelText(d => d.city)
        .labelSize(0.9)
        .labelDotRadius(d => 0.3 + 0.35 * (d.pct_delayed - MIN_PCT) / (MAX_PCT - MIN_PCT || 1))
        .labelColor(d => riskColor(d.pct_delayed))
        .labelResolution(2)
        .onLabelClick(select);

      globe.globeMaterial().color.set("#cde6e2");

      fetch("countries-110m.geojson").then(r => r.json()).then(geo => globe.polygonsData(geo.features));

      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const controls = globe.controls();
      controls.autoRotate = !reduceMotion;
      controls.autoRotateSpeed = 0.4;
      let idleT;
      controls.addEventListener("start", () => { controls.autoRotate = false; clearTimeout(idleT); });
      controls.addEventListener("end", () => { if (!reduceMotion) idleT = setTimeout(() => (controls.autoRotate = true), 10000); });
      globe.pointOfView({ lat: 35, lng: 35, altitude: 2.1 });

      function showTip(d, e) {
        tip.innerHTML = `<b>${d.city}</b><br>${t("delayed", "rötarlı")}: ${d.pct_delayed}% · ${t("median", "medyan")} ${d.median} ${t("min", "dk")}`;
        tip.style.display = "block";
      }
      function hideTip() { tip.style.display = "none"; }
      document.addEventListener("mousemove", e => {
        if (tip.style.display === "block") { tip.style.left = e.clientX + 14 + "px"; tip.style.top = e.clientY + 14 + "px"; }
      });

      function select(d) {
        selected = d;
        globe.arcStroke(x => (x === selected ? 1.1 : 0.5));
        globe.pointOfView({ lat: d.lat, lng: d.lon, altitude: 1.2 }, 1000);
        $("detail").hidden = false;
        $("dtag").textContent = d.icao;
        $("dcity").textContent = d.city;
        $("dairport").textContent = d.name;
        const cat = CATS[d.cat];
        const li = getLang() === "tr" ? 1 : 0;
        $("dcat").textContent = cat.label[li];
        $("dcat").style.background = cat.color;
        $("dreason").textContent = d.reason[li];
        $("droute").innerHTML = `<b>IST</b> (İstanbul) →<br><b>${d.icao}</b> ${d.city}`;
        $("dstats").innerHTML =
          `${t("Delayed 15+ min","15+ dk rötarlı")}: <b>${d.pct_delayed}%</b><br>` +
          `${t("Median delay","Medyan rötar")}: <b>${d.median} ${t("min","dk")}</b><br>` +
          `${t("Sample","Örneklem")}: <b>${d.flights}</b> ${t("flights","uçuş")}`;
        renderList();
      }
      $("dclose").onclick = () => {
        selected = null;
        $("detail").hidden = true;
        globe.arcStroke(0.5);
        renderList();
      };

      // route list = the interactive nav AND the accessible table-view
      // fallback for the chart (screen readers / non-WebGL get this)
      function renderList() {
        $("routelist").innerHTML = ROUTES.map((d, i) => `
          <button data-i="${i}" class="${d === selected ? 'active' : ''}">
            <span class="rank">${i + 1}</span>
            <i style="background:${CATS[d.cat].color};width:7px;height:7px;border-radius:999px;flex:none;margin-right:2px"></i>
            <span class="city">${d.city}</span>
            <span class="pct" style="color:${riskColor(d.pct_delayed)}">${d.pct_delayed}%</span>
          </button>`).join("");
        $("routelist").querySelectorAll("button").forEach(b =>
          b.onclick = () => select(ROUTES[+b.dataset.i]));
      }
      renderList();

      // legend for the category dimension (dataviz rule: >=2 categorical
      // colors always get a legend, not just the color-by-itself)
      function renderCatLegend() {
        const li = getLang() === "tr" ? 1 : 0;
        $("catlegend").innerHTML = Object.values(CATS)
          .map(c => `<span><i style="background:${c.color}"></i>${c.label[li]}</span>`).join("");
      }
      renderCatLegend();

      document.addEventListener("langchange", () => {
        renderCatLegend();
        renderList();
        if (selected) select(selected);
      });
    </script>
  </body>
</html>
