<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>WhereisMyRide</title>
  <meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0E1014" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <!-- HOME: pick a line -->
  <main id="home" class="screen">
    <header class="top">
      <div class="brand">WhereisMyRide</div>
      <p class="hello" data-t="Hangi hattasın?|Which line are you on?"></p>
    </header>

    <button id="again" class="again hidden" type="button">
      <span class="badge" id="againBadge"></span>
      <span class="again-text"><small data-t="Geçen seferki gibi|Same as last time"></small><b id="againRoute"></b></span>
      <span class="again-go" aria-hidden="true">›</span>
    </button>

    <section class="group" id="groups"></section>

    <section class="rides">
      <div class="rides-head">
        <h2 data-t="Yolculukların|Your rides"></h2>
        <button id="shareall" class="link hidden" type="button" data-t="Hepsini paylaş|Share all"></button>
      </div>
      <ul id="rides"></ul>
      <p class="fine" data-t="Kayıtlar yalnızca bu telefonda durur; sen paylaşmadıkça hiçbir yere gitmez. Konum (GPS) kullanılmaz.|Rides stay on this phone and go nowhere unless you share them. No location (GPS) is used."></p>
    </section>
    <p class="warn hidden" id="nosensor"></p>
  </main>

  <!-- SHEET: stations of the chosen line -->
  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-panel">
      <header class="sheet-head">
        <span class="badge big" id="sheetBadge"></span>
        <div class="sheet-title">
          <h2 id="sheetTitle"></h2>
          <small id="sheetEnds"></small>
        </div>
        <button class="close" id="sheetClose" type="button" aria-label="Kapat">×</button>
      </header>

      <div class="steps" aria-hidden="true"><i data-step="1"></i><i data-step="2"></i><i data-step="3"></i></div>
      <h3 class="prompt" id="prompt"></h3>

      <!-- step 1-2: station strip -->
      <div id="pickStations">
        <input id="filter" type="search" autocomplete="off" />
        <ol class="strip" id="strip"></ol>
      </div>

      <!-- step 3: summary + start -->
      <div id="confirm" class="hidden">
        <div class="trip">
          <div class="trip-ends"><b id="cFrom"></b><span class="arrow" aria-hidden="true"></span><b id="cTo"></b></div>
          <p id="cDir"></p>
        </div>
        <h4 data-t="Telefon nerede?|Where's the phone?"></h4>
        <div class="chips" id="pos" role="radiogroup"></div>
        <p class="fine" data-t="Yolculuk boyunca telefonu aynı yerde tut.|Keep the phone in the same place the whole ride."></p>
        <div class="confirm-actions">
          <button class="chunky ghost" id="backToStations" type="button" data-t="Değiştir|Change"></button>
          <button class="chunky line" id="start" type="button" data-t="Kaydı başlat|Start recording"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- RECORDING -->
  <main id="recording" class="screen hidden">
    <div class="rec-band">
      <span class="badge big" id="recBadge"></span>
      <div><b id="recRoute"></b><small id="recDir"></small></div>
    </div>
    <div class="rec-body">
      <div class="clock" id="elapsed">0:00</div>
      <div class="state" id="state"><span class="dot"></span><span id="statetext"></span></div>
      <ol class="strip live" id="recStrip"></ol>
      <p class="fine center" data-t="Konum tahmini: duruşları sayarak. Gerçek analiz kayıttan sonra yapılır.|Position is an estimate from counting stops. The real analysis runs after the ride."></p>
      <div class="stats">
        <div><b id="nstops">0</b><span data-t="durak|stops"></span></div>
        <div><b id="expect">–</b><span data-t="beklenen|expected"></span></div>
        <div><b id="hz">–</b><span data-t="ölçüm/sn|samples/s"></span></div>
      </div>
      <details class="more">
        <summary data-t="Not ekle|Add a note"></summary>
        <label for="vehicle" data-t="Vagon numarası|Car number"></label>
        <input type="text" id="vehicle" inputmode="numeric" data-ph="vagonun içinde yazan numara|the number shown inside the car" />
        <label for="notes" data-t="Not|Note"></label>
        <input type="text" id="notes" data-ph="ör. tünelde 1 dk bekledik|e.g. held 1 min in a tunnel" />
      </details>
      <p class="warn hidden" id="gapwarn"></p>
      <p class="fine center" data-t="Ekran açık kalmalı: tarayıcı, ekran kapanınca sensörü durdurur.|Keep the screen on: the browser pauses the sensor when it turns off."></p>
    </div>
    <div class="rec-foot">
      <button class="chunky dark" id="stop" type="button" data-t="İndim · kaydı bitir|I'm off · stop recording"></button>
    </div>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
