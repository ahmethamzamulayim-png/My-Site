# Copy this next to each phyphox export. Station names must match network/m4.json exactly.
date: 2026-10-07            # YYYY-MM-DD
line: M4
direction: Kadıköy          # end station the train is heading to (matched against the timetable's direction names)
board: Göztepe              # where you got on
alight: Kadıköy             # where you got off
phone_position: lap-flat    # lap-flat | bag-on-knees | pocket | hand ... keep it the same all ride
start_clock: "08:12:30"     # wall-clock time you pressed start, to the SECOND - the whole timetable comparison hangs on this
car: 3                      # optional: which car (front/back cars may feel braking differently)
notes: ""                   # anything unusual: held in a tunnel, very crowded, phone moved at Ünalan
